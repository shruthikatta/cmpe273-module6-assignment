apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-client
  namespace: module6
  labels:
    app: inventory-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-client
  template:
    metadata:
      labels:
        app: inventory-client
    spec:
      containers:
        - name: client
          image: inventory-client:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: INVENTORY_URL
              value: http://inventory:8080/inventory
            - name: INTERVAL_SECONDS
              value: "1"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
